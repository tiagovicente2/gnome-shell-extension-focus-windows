name: Build

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell make python3
      - name: Build extension package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: focus-windows-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: focus-windows-extension
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.shell-extension.zip --generate-notes
